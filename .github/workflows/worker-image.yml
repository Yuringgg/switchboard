name: Worker image

on:
  push:
    branches: [main]
    paths:
      # Only rebuild when something in the image could actually have changed.
      # The console and docs share this repo and have nothing to do with it.
      #
      # ⚠ Every workspace package the worker DEPENDS ON has to be listed here.
      # A missing entry does not fail — it silently ships the previous image
      # while the commit looks deployed, which is the same shape of failure as
      # the BOM incident (docs/02-ARCHITECTURE.md §8): green everywhere, old
      # code running. `packages/ai` was added in Phase 4A and belongs here for
      # exactly that reason.
      - 'apps/worker/**'
      - 'packages/ai/**'
      - 'packages/core/**'
      - 'packages/db/**'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.base.json'
      - '.github/workflows/worker-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}-worker

jobs:
  build:
    runs-on: ubuntu-latest

    # Least privilege, and `packages: write` is what makes GITHUB_TOKEN able to
    # push to ghcr at all. No PAT: the built-in token is scoped to this
    # repository, expires with the job, and cannot be leaked from a fork PR.
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Switchboard worker — queue consumer for normalize, embed and extract
            org.opencontainers.image.licenses=UNLICENSED

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          # Repository root, not apps/worker: the Dockerfile copies the
          # workspace packages the worker depends on.
          context: .
          file: apps/worker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          # org.opencontainers.image.source is what links the package to this
          # repo on GitHub. Without it the package page has no source link and
          # inherits no repository visibility.
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Worker image pushed" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '${{ steps.meta.outputs.tags }}' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'New packages are PRIVATE by default. Flip it to public at' >> "$GITHUB_STEP_SUMMARY"
          echo 'https://github.com/${{ github.repository_owner }}?tab=packages before Container Apps can pull it anonymously.' >> "$GITHUB_STEP_SUMMARY"
